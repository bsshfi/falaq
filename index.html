<!doctype html>
<html lang="ar" dir="rtl" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فَلَق</title>
<meta name="description" content="فَلَق — مواقيت الصلاة والقبلة ومنازل القمر، يعمل بدون إنترنت">
<meta name="theme-color" content="#0F1830">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="فَلَق">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500&family=Readex+Pro:wght@300;400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<script>
/* تطبيق المظهر واللغة قبل الرسم لتجنب الوميض */
(function(){try{var s=JSON.parse(localStorage.getItem('falaq')||'{}'),d=document.documentElement;
d.setAttribute('data-theme',s.theme||'auto');if(s.lang==='en'){d.lang='en';d.dir='ltr';}}catch(e){}})();
</script>
<style>
:root{
  --night:#0F1830; --night-2:#16213F; --night-3:#1D2A4E;
  --line:rgba(190,205,255,.11); --line-2:rgba(190,205,255,.2);
  --text:#EDE7DA; --muted:#8E98B8; --faint:#5F6A8C;
  --text-rgb:237,231,218;
  --gold:#F0C26A; --accent:#F0C26A; --rose:#E59C93; --sky:#9CC3E6; --pearl:#E9E4D8;
  --tabbar:rgba(22,33,63,.86); --toast-bg:#E9E4D8; --toast-fg:#151a2b;
  --moon-shadow:rgba(14,22,44,.9); --moon-halo:233,228,216; --moon-lit:#E9E4D8; --moon-dark:#26335C;
  --glow:0; --glow-c:229,156,147;
  --display:'Reem Kufi', 'SF Arabic', 'Geeza Pro', system-ui, sans-serif;
  --body:'Readex Pro', 'SF Arabic', 'Geeza Pro', system-ui, sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --night:#EEF2F8; --night-2:#FFFFFF; --night-3:#E1E7F2;
  --line:rgba(26,35,64,.09); --line-2:rgba(26,35,64,.18);
  --text:#18213D; --muted:#5A6483; --faint:#8A93AD;
  --text-rgb:24,33,61;
  --gold:#E7AE4A; --accent:#97620A; --rose:#C9675C;
  --tabbar:rgba(255,255,255,.88); --toast-bg:#18213D; --toast-fg:#F4F1EA;
  --moon-shadow:rgba(36,46,78,.8); --moon-halo:231,174,74; --moon-lit:#E7AE4A; --moon-dark:#D5DCEA;
  color-scheme:light;
}
@media (prefers-color-scheme:light){
  :root[data-theme="auto"]{
    --night:#EEF2F8; --night-2:#FFFFFF; --night-3:#E1E7F2;
    --line:rgba(26,35,64,.09); --line-2:rgba(26,35,64,.18);
    --text:#18213D; --muted:#5A6483; --faint:#8A93AD;
    --text-rgb:24,33,61;
    --gold:#E7AE4A; --accent:#97620A; --rose:#C9675C;
    --tabbar:rgba(255,255,255,.88); --toast-bg:#18213D; --toast-fg:#F4F1EA;
    --moon-shadow:rgba(36,46,78,.8); --moon-halo:231,174,74; --moon-lit:#E7AE4A; --moon-dark:#D5DCEA;
    color-scheme:light;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--night);
  background-image:radial-gradient(120% 55% at 50% 108%, rgba(var(--glow-c),calc(var(--glow)*.42)) 0%, rgba(var(--glow-c),0) 70%);
  background-attachment:fixed;
  color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;
  font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
a{color:var(--accent)}
.app{max-width:480px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 96px);min-height:100%}

/* رأس الصفحة */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.brand{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:0;line-height:1;margin:0}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--faint);letter-spacing:.18em;margin-top:5px;text-align:end}
[lang="en"] .brand{letter-spacing:.04em}
[lang="en"] .brand small{letter-spacing:0;font-family:var(--display);font-size:13px}
.loc{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;max-width:58%}
.loc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc svg{flex:none}

.view{display:none}
.view.on{display:block;animation:fade .28s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}}

/* شريط التاريخ */
.dates{display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px}
.dates .arrow{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.dates .arrow:active{background:var(--night-2)}
[dir="rtl"] .dates .arrow svg{transform:scaleX(-1)}
.dates .mid{text-align:center;flex:1}
.dates .hijri{font-family:var(--display);font-size:19px;font-weight:600}
.dates .greg{font-size:13px;color:var(--muted)}
.today-btn{font-size:12px;color:var(--accent);margin-top:2px;visibility:hidden}
.today-btn.show{visibility:visible}

/* قرص اليوم */
.dial-wrap{position:relative;width:100%;max-width:340px;margin:2px auto 0;aspect-ratio:1}
.dial-wrap svg{width:100%;height:100%;display:block;overflow:visible;direction:ltr}
.dial-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.dial-center .k{font-size:13px;color:var(--muted)}
.dial-center .name{font-family:var(--display);font-size:40px;font-weight:700;line-height:1.15}
[lang="en"] .dial-center .name{font-size:36px}
.dial-center .t{font-size:17px;color:var(--accent);font-weight:500}
.dial-center .cd{font-size:28px;font-weight:300;letter-spacing:.02em;direction:ltr;margin-top:4px}

/* قائمة المواقيت */
.times{list-style:none;margin:10px 0 0;padding:0}
.times li{display:flex;align-items:center;justify-content:space-between;padding:13px 6px;border-bottom:1px solid var(--line);position:relative}
.times li:last-child{border-bottom:0}
.times .n{font-family:var(--display);font-size:19px;font-weight:600}
.times .v{font-size:18px;font-weight:500;direction:ltr}
.times li.past .n,.times li.past .v{color:var(--faint)}
.times li.next{background:linear-gradient(to left,rgba(240,194,106,.15),rgba(240,194,106,0) 80%);border-radius:10px;border-bottom-color:transparent}
[dir="ltr"] .times li.next{background:linear-gradient(to right,rgba(240,194,106,.15),rgba(240,194,106,0) 80%)}
.times li.next::before{content:"";position:absolute;inset-inline-start:-2px;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--gold)}
.times li.next .n,.times li.next .v{color:var(--accent)}
.times li.minor .n{font-family:var(--body);font-size:15px;font-weight:400;color:var(--muted)}
.times li.minor .v{font-size:15px;color:var(--muted);font-weight:400}
.sep{height:14px}

.link-btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;margin-top:16px;padding:14px;border:1px solid var(--line-2);border-radius:14px;color:var(--text);font-size:15px}
.link-btn:active{background:var(--night-2)}
.primary{background:var(--gold);color:#1a1405;border:0;font-weight:600}
.primary:active{filter:brightness(.94)}

/* أقسام المعلومات */
.panel{margin-top:22px}
.panel h2,.block h2{font-family:var(--display);font-size:20px;font-weight:600;margin:0 0 4px}
.panel .sub{font-size:13px;color:var(--muted);margin:0 0 10px}
.rows{margin:0;padding:0}
.rows>div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}
.rows>div:last-child{border-bottom:0}
.rows dt{color:var(--muted);font-size:14px}
.rows dd{margin:0;font-size:15px;font-weight:500;text-align:end}
.note{font-size:13px;color:var(--muted);line-height:1.7;margin:8px 0 0}
.block{background:var(--night-2);border-radius:18px;padding:16px 16px 6px;margin-top:14px}
.block.tight{padding-bottom:14px}

/* القبلة */
.compass-wrap{position:relative;width:100%;max-width:330px;margin:18px auto 0;aspect-ratio:1}
.compass-wrap svg{width:100%;height:100%;display:block;overflow:visible;direction:ltr}
.q-status{text-align:center;margin-top:10px;min-height:62px}
.q-status .big{font-family:var(--display);font-size:24px;font-weight:600}
.q-status .small{font-size:14px;color:var(--muted)}
.q-status.aligned .big{color:var(--accent)}
.q-nums{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.q-nums div{text-align:center;padding:12px 4px}
.q-nums div+div{border-inline-start:1px solid var(--line)}
.q-nums b{display:block;font-size:20px;font-weight:500;direction:ltr}
.q-nums span{font-size:12px;color:var(--muted)}

/* القمر */
.moon-hero{display:flex;flex-direction:column;align-items:center;margin-top:12px}
#moonCanvas{width:230px;height:230px}
.moon-cap{font-size:12px;color:var(--faint);margin-top:6px}
.moon-phase{font-family:var(--display);font-size:30px;font-weight:700;margin-top:10px;line-height:1.2}
.moon-sub{color:var(--muted);font-size:14px}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.phases div{text-align:center;padding:12px 2px}
.phases svg{width:30px;height:30px;display:block;margin:0 auto 6px}
.phases b{display:block;font-size:13px;font-weight:500}
.phases span{display:block;font-size:12px;color:var(--muted)}
.mansion-wrap{display:flex;gap:16px;align-items:center}
.mansion-wrap svg{width:132px;height:132px;flex:none}
.mansion-txt .lbl{font-size:13px;color:var(--muted)}
.mansion-txt .m{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.3}
.mansion-txt .s{font-size:14px;color:var(--muted)}
.star-name{font-family:var(--display);font-size:26px;font-weight:600}
.bar{height:6px;border-radius:6px;background:var(--night-3);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));border-radius:6px}
.bar-meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}

/* الإعدادات */
.set-group{margin-top:20px}
.set-group h3{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 6px}
.set{background:var(--night-2);border-radius:16px;overflow:hidden}
.set>*{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 16px;border-bottom:1px solid var(--line);text-align:start;min-height:52px}
.set>*:last-child{border-bottom:0}
.set label,.set .lbl{font-size:15px}
.set .val{color:var(--muted);font-size:14px}
[dir="rtl"] .chev{transform:scaleX(-1)}
select{font:inherit;background:transparent;border:0;font-size:14px;text-align:end;max-width:60%;-webkit-appearance:none;appearance:none;color:var(--muted)}
select option{background:var(--night-2);color:var(--text)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;flex:none}
.seg button{padding:6px 12px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--gold);color:#1a1405;font-weight:600}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line-2);font-size:18px;line-height:1;color:var(--text)}
.stepper output{min-width:46px;text-align:center;font-size:14px;direction:ltr;color:var(--muted)}

/* عن التطبيق + شعار ومض آرك */
.about{text-align:center;padding:30px 0 8px;color:var(--muted);font-size:13px}
.about .ver{font-family:var(--display);color:var(--text);font-size:17px;margin-bottom:4px}
.wamd{display:block;margin:26px auto 0;max-width:260px;text-decoration:none;color:var(--text)}
.wamd svg{width:100%;height:auto;display:block;overflow:visible}
.wamd .tag{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.wamd .dom{display:block;font-family:Montserrat,system-ui,sans-serif;font-weight:300;font-size:11px;letter-spacing:.24em;color:var(--faint);margin-top:2px;direction:ltr}

/* الشريط السفلي */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 12px);width:calc(100% - 32px);max-width:448px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--tabbar);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line);border-radius:22px;padding:6px;z-index:20}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:16px;color:var(--faint);font-size:11.5px}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--accent);background:rgba(240,194,106,.12)}

/* النوافذ */
.sheet-bg{position:fixed;inset:0;background:rgba(6,10,22,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--night-2);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(var(--safe-b) + 22px);animation:up .28s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .grip{width:40px;height:5px;border-radius:5px;background:var(--line-2);margin:0 auto 14px}
.sheet h2{font-family:var(--display);font-size:22px;margin:0 0 6px}
.sheet p{color:var(--muted);font-size:14px;margin:0 0 12px}
.steps{list-style:none;padding:0;margin:14px 0;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:center;padding:10px 0;counter-increment:s;font-size:15px}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--night-3);display:grid;place-items:center;font-size:13px;color:var(--accent)}
.steps svg{vertical-align:-5px}
.month{width:100%;border-collapse:collapse;font-size:13px}
.month th{color:var(--muted);font-weight:500;padding:8px 2px;position:sticky;top:-10px;background:var(--night-2);font-family:var(--body)}
.month td{text-align:center;padding:8px 2px;border-top:1px solid var(--line);direction:ltr}
.month tr.today td{color:var(--accent);font-weight:600}
.month td.d{color:var(--muted);white-space:nowrap;direction:inherit}
.city-list{max-height:50vh;overflow:auto;margin:6px 0}
.city-list button{display:flex;justify-content:space-between;width:100%;padding:13px 4px;border-bottom:1px solid var(--line);font-size:15px}
.city-list button span{color:var(--muted);font-size:13px;direction:ltr}
.field{display:flex;gap:8px;margin:8px 0}
.field input{flex:1;min-width:0;font:inherit;color:var(--text);background:var(--night-3);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;direction:ltr;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 96px);background:var(--toast-bg);color:var(--toast-fg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;max-width:calc(100% - 40px);text-align:center}
.toast.on{opacity:1}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(240,194,106,.12);border:1px solid rgba(240,194,106,.32);border-radius:14px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.banner button{color:var(--accent);font-weight:600;white-space:nowrap}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="brand"><span data-t="brand"></span><small data-t="brandSub"></small></h1>
    <button class="loc" id="locBtn" data-ta="location">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span id="locName"></span>
    </button>
  </header>
  <div id="locBanner" class="banner" hidden>
    <span id="locBannerTxt"></span>
    <button id="locBannerBtn"></button>
  </div>

  <!-- الصلاة -->
  <section class="view on" id="v-prayer">
    <div class="dates">
      <button class="arrow" id="dayPrev" data-ta="prevDay"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="mid">
        <div class="hijri" id="hijriDate"></div>
        <div class="greg" id="gregDate"></div>
        <button class="today-btn" id="todayBtn" data-t="backToday"></button>
      </div>
      <button class="arrow" id="dayNext" data-ta="nextDay"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="dial-wrap">
      <svg id="dial" viewBox="-170 -170 340 340" role="img"></svg>
      <div class="dial-center" id="dialCenter"></div>
    </div>
    <ul class="times" id="timesList"></ul>
    <button class="link-btn" id="monthBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span data-t="monthly"></span>
    </button>
  </section>

  <!-- القبلة -->
  <section class="view" id="v-qibla">
    <div class="compass-wrap">
      <svg id="compass" viewBox="-170 -170 340 340" role="img"></svg>
    </div>
    <div class="q-status" id="qStatus"></div>
    <button class="link-btn primary" id="compassBtn" data-t="startCompass"></button>
    <div class="q-nums">
      <div><b id="qBearing">—</b><span data-t="qBearing"></span></div>
      <div><b id="qHeading">—</b><span data-t="qHeading"></span></div>
      <div><b id="qDist">—</b><span data-t="qDist"></span></div>
    </div>
    <button class="link-btn" id="sunCalBtn" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span data-t="sunCal"></span>
    </button>
    <p class="note" data-t="compassNote"></p>
    <div class="panel">
      <h2 data-t="sunQiblaTitle"></h2>
      <p class="sub" data-t="sunQiblaSub"></p>
      <dl class="rows" id="sunQibla"></dl>
      <p class="note" data-t="transitNote"></p>
    </div>
  </section>

  <!-- القمر -->
  <section class="view" id="v-moon">
    <div class="moon-hero">
      <canvas id="moonCanvas" width="460" height="460"></canvas>
      <div class="moon-cap" id="moonCap"></div>
      <div class="moon-phase" id="moonPhase"></div>
      <div class="moon-sub" id="moonSub"></div>
    </div>
    <dl class="rows panel" id="moonRows"></dl>
    <div class="panel">
      <h2 data-t="nextPhases"></h2>
      <div class="phases" id="phases"></div>
    </div>
    <div class="block">
      <div class="mansion-wrap">
        <svg id="mansionRing" viewBox="-70 -70 140 140" aria-hidden="true"></svg>
        <div class="mansion-txt" id="mansionTxt"></div>
      </div>
      <p class="note" style="margin-bottom:10px" data-t="mansionNote"></p>
    </div>
    <div class="block" id="hilalBlock"></div>
    <div class="block tight" id="whiteBlock"></div>
