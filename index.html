<!doctype html>
<html lang="ar" dir="rtl" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>فلق | Falaq</title>
<meta name="description" content="فَلَق — مواقيت الصلاة والقبلة ومنازل القمر، يعمل بدون إنترنت">
<meta name="theme-color" content="#7fa6c6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="فلق | Falaq">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
<script>
/* تطبيق المظهر واللغة قبل الرسم لتجنب الوميض */
(function(){try{var s=JSON.parse(localStorage.getItem('falaq')||'{}'),d=document.documentElement;
d.setAttribute('data-theme',s.theme||'auto');if(s.lang==='en'){d.lang='en';d.dir='ltr';}}catch(e){}})();
</script>
<style>
/* ===== فَلَق 2.0 — هوية ومض آرك الموحّدة مع سهم: سماء ضبابية تذوب في الرمل، ألواح زجاجية، ولون برتقالي واحد ===== */
:root{
  --sky1:#7fa6c6; --sky2:#b9cddb; --haze:#e9dfd3; --sand:#f4ede4; --sand2:#efe6da;
  --r1:#c9cfd6; --r2:#d8d6d2; --r3:#e4dcd2; --r4:#ece3d8;
  --panel:rgba(255,255,255,.66); --panel2:rgba(255,255,255,.5); --line:rgba(255,255,255,.8); --line-2:rgba(60,64,72,.14); --sep:rgba(120,110,100,.16);
  --fg:#22262e; --dim:#737882; --faint:#a1a4ab; --gsh:rgba(80,70,60,.12);
  --arrow:#f5841f; --arrow2:#d4610b; --accent:#c9590a; --good:#2f9a68;
  --sheet:#fbf8f4; --toast-bg:#22262e; --toast-fg:#fff; --scrim:rgba(58,50,42,.35);
  /* أسماء قديمة يستخدمها الكود */
  --text:var(--fg); --muted:var(--dim); --text-rgb:34,38,46; --gold:var(--arrow); --rose:var(--arrow);
  --night:var(--sky1); --night-2:#f7f2ec; --night-3:rgba(60,64,72,.08);
  --moon-shadow:rgba(38,46,68,.84); --moon-halo:255,255,255; --moon-lit:#f1e8d6; --moon-dark:#cfd4dc;
  --ui:'IBM Plex Sans Arabic',-apple-system,'SF Arabic','Geeza Pro',system-ui,sans-serif;
  --display:var(--ui); --body:var(--ui);
  --num:-apple-system,'SF Pro Rounded','SF Pro Display',system-ui,'IBM Plex Sans Arabic',sans-serif;
  --naskh:'Amiri','Noto Naskh Arabic','Geeza Pro',serif;
  --zk-size:22px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --sky1:#0c1424; --sky2:#1b2740; --haze:#2a3247; --sand:#151b2a; --sand2:#121827;
  --r1:#2a3550; --r2:#232c43; --r3:#1d2539; --r4:#181f31;
  --panel:rgba(255,255,255,.08); --panel2:rgba(255,255,255,.05); --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.16); --sep:rgba(255,255,255,.09);
  --fg:#eef1f6; --dim:#97a0b3; --faint:#69728a; --gsh:rgba(0,0,0,.35); --accent:#ffa55a;
  --sheet:#1a2133; --toast-bg:#eef1f6; --toast-fg:#121827; --scrim:rgba(0,0,0,.55);
  --text-rgb:238,241,246; --night-2:#1a2133; --night-3:rgba(255,255,255,.07);
  --moon-shadow:rgba(9,13,24,.9); --moon-lit:#ece6d6; --moon-dark:#2b3550;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root[data-theme="auto"]{
    --sky1:#0c1424; --sky2:#1b2740; --haze:#2a3247; --sand:#151b2a; --sand2:#121827;
    --r1:#2a3550; --r2:#232c43; --r3:#1d2539; --r4:#181f31;
    --panel:rgba(255,255,255,.08); --panel2:rgba(255,255,255,.05); --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.16); --sep:rgba(255,255,255,.09);
    --fg:#eef1f6; --dim:#97a0b3; --faint:#69728a; --gsh:rgba(0,0,0,.35); --accent:#ffa55a;
    --sheet:#1a2133; --toast-bg:#eef1f6; --toast-fg:#121827; --scrim:rgba(0,0,0,.55);
    --text-rgb:238,241,246; --night-2:#1a2133; --night-3:rgba(255,255,255,.07);
    --moon-shadow:rgba(9,13,24,.9); --moon-lit:#ece6d6; --moon-dark:#2b3550;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;overflow-x:clip;background:var(--sky1)}
body{background:var(--sand2);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--arrow);outline-offset:3px;border-radius:8px}
a{color:var(--accent)}
.ltr{direction:ltr;unicode-bidi:isolate}

/* الخلفية: سماء ← ضباب ← رمل، مع تلال باهتة (نفس سهم) */
.bg3{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 22%,var(--haze) 44%,var(--sand) 68%,var(--sand2) 100%)}
.bg3 svg{position:absolute;left:0;width:100%;height:30%}
.bg3 .r1{fill:var(--r1);opacity:.55}.bg3 .r2{fill:var(--r2);opacity:.7}.bg3 .r3{fill:var(--r3);opacity:.8}.bg3 .r4{fill:var(--r4);opacity:.9}
.st3{position:absolute;inset:0 0 62% 0;display:none;background-image:radial-gradient(1.2px 1.2px at 12% 20%,#fff 70%,transparent),radial-gradient(1px 1px at 30% 8%,#fff 70%,transparent),radial-gradient(1.2px 1.2px at 52% 16%,#fff 70%,transparent),radial-gradient(1px 1px at 70% 30%,#fff 70%,transparent),radial-gradient(1.3px 1.3px at 88% 12%,#fff 70%,transparent),radial-gradient(1px 1px at 8% 44%,#fff 70%,transparent),radial-gradient(1px 1px at 40% 36%,#fff 70%,transparent),radial-gradient(1.1px 1.1px at 62% 6%,#fff 70%,transparent),radial-gradient(1px 1px at 80% 42%,#fff 70%,transparent),radial-gradient(1px 1px at 22% 30%,#fff 70%,transparent);opacity:.7}
:root[data-theme="dark"] .st3{display:block}
@media (prefers-color-scheme:dark){:root[data-theme="auto"] .st3{display:block}}

.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:calc(var(--safe-t) + 10px) 16px calc(var(--safe-b) + 104px);min-height:100vh}

/* الزجاج */
.gl,.block,.panel,.set,.zk,.pt,.mini,.chip,.tabs,.seg,.zk-size,.sheet,.q-quality,.banner{-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3)}
.gl{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 28px var(--gsh)}

/* الرأس */
.top{display:flex;align-items:center;gap:10px;color:#fff}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:0;margin:0}
.bw{display:flex;align-items:center;gap:7px}
.logo{margin:0;font-family:var(--ui);font-size:34px;font-weight:700;line-height:1.05;letter-spacing:0;color:#fff;text-shadow:0 1px 8px rgba(40,60,90,.18)}
[lang="en"] .logo{font-size:29px;letter-spacing:.02em}
.sunr{width:30px;height:30px;color:var(--arrow);filter:drop-shadow(0 2px 6px rgba(245,132,31,.25))}
.ptitle{font-size:12.5px;color:rgba(255,255,255,.94);font-weight:500;margin-top:2px}
.moonw{margin-inline-start:auto;display:flex;align-items:center;gap:9px;color:#fff;text-align:end}
[dir="ltr"] .moonw{flex-direction:row-reverse;text-align:start}
.moonw svg{width:48px;height:48px;flex:none;filter:drop-shadow(0 2px 10px rgba(255,240,200,.45));direction:ltr}
.hij{display:flex;flex-direction:column;font-size:11.5px;line-height:1.35}
.hij b{font-size:13.5px;font-weight:700}.hij span{opacity:.88}

/* الشرائح */
.chips{display:flex;gap:8px;margin-top:14px}
.chip{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;height:40px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.32);border:1px solid rgba(255,255,255,.6);color:#1d2433;font-size:13.5px;font-weight:600;white-space:nowrap}
:root[data-theme="dark"] .chip{background:var(--panel);border-color:var(--line);color:var(--fg)}
@media (prefers-color-scheme:dark){:root[data-theme="auto"] .chip{background:var(--panel);border-color:var(--line);color:var(--fg)}}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip svg{flex:none;opacity:.75}
#locBtn{flex:0 1 auto;max-width:46%}
.datechip{flex:1;justify-content:space-between;padding:0 4px}
.datechip>span{flex:1;text-align:center;font-size:13px}
.datechip button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.datechip button:active{background:rgba(255,255,255,.4)}
[dir="rtl"] .datechip button svg{transform:scaleX(-1)}
.datechip .today-btn{display:none;background:var(--arrow)!important;color:#fff!important;border-radius:999px!important;width:auto!important;padding:0 10px;font-size:12px;font-weight:700;height:26px!important}
.datechip .today-btn.show{display:grid}

.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(90deg,rgba(253,230,189,.92),rgba(252,239,214,.92));border:1px solid #f6d6a3;color:#2a2116;border-radius:18px;padding:10px 14px;margin-top:10px;font-size:13.5px}
[dir="rtl"] .banner{background:linear-gradient(270deg,rgba(253,230,189,.92),rgba(252,239,214,.92))}
.banner button{color:#b8550a;font-weight:700;white-space:nowrap}

.view{display:none}
.view.on{display:block;animation:fade .28s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}}

/* البطاقة الرئيسية: الصلاة القادمة */
.hero{margin-top:14px;padding:16px 18px 10px;position:relative}
.htop{display:flex;align-items:center;gap:12px}
.hic{width:58px;height:58px;flex:none;color:var(--arrow);filter:drop-shadow(0 4px 10px rgba(245,132,31,.22))}
.hic svg{width:100%;height:100%}
.hmeta{display:flex;flex-direction:column;min-width:0}
.hmeta small{font-size:12.5px;color:var(--dim);font-weight:500}
.hmeta b{font-size:27px;font-weight:700;line-height:1.2;white-space:nowrap}
.hmeta span{font-size:13.5px;color:var(--dim);white-space:nowrap}
[lang="en"] .hmeta b{font-size:23px}[lang="en"] .hcd b{font-size:32px}[lang="en"] .hic{width:48px;height:48px}
.hmeta span b{font-size:inherit;font-family:var(--num);color:var(--accent);font-weight:700}
.hcd{flex:none;margin-inline-start:auto;text-align:end;display:flex;flex-direction:column;align-items:flex-end}
.hcd b{font-family:var(--num);font-size:40px;font-weight:700;line-height:1;direction:ltr;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.hcd small{font-size:12px;color:var(--dim);margin-top:5px}
.hcd b:empty{display:none}.hcd b:empty+small{font-size:15px;font-weight:700;color:var(--accent);margin:0}
.dayline{margin:12px -4px 0;cursor:grab}
.dayline svg{width:100%;height:auto;display:block;overflow:visible;direction:ltr}

/* بطاقات صغيرة */
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mini{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 20px var(--gsh);padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.mini svg{width:20px;height:20px;color:var(--dim);margin-bottom:2px}
.mini small{font-size:11.5px;color:var(--dim);line-height:1.3}
.mini b{font-family:var(--num);font-size:16px;font-weight:700;direction:ltr}
.mini b small{font-family:var(--ui);font-size:11px;font-weight:600;margin-inline-start:3px}

/* عنوان قسم */
.shead{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 8px}
.shead h2{margin:0;font-size:16px;font-weight:700}
.shead button{display:flex;align-items:center;gap:4px;color:var(--accent);font-size:13px;font-weight:600}
[dir="rtl"] .shead button svg{transform:scaleX(-1)}

/* مواقيت اليوم */
.ptimes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;list-style:none;margin:0;padding:0}
.pt{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 20px var(--gsh);padding:11px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;transition:opacity .2s}
.pt svg{width:26px;height:26px;color:var(--dim);margin-bottom:3px}
.pt .n{font-size:13px;color:var(--dim);font-weight:600}
.pt .v{font-family:var(--num);font-size:20px;font-weight:700;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
.pt .v small{font-family:var(--ui);font-size:11px;font-weight:600;color:var(--dim);margin-inline-start:3px}
.pt.past{opacity:.55}
.pt.next{background:linear-gradient(180deg,#ff9d45,var(--arrow));border-color:transparent;box-shadow:0 10px 22px rgba(245,132,31,.35);color:#fff}
.pt.next svg,.pt.next .n,.pt.next .v small{color:#fff}

/* أزرار */
.link-btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;margin-top:12px;padding:14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);color:var(--fg);font-size:15px;font-weight:600;box-shadow:0 6px 16px var(--gsh)}
.link-btn:active{transform:scale(.99)}
.primary,.link-btn.primary{background:linear-gradient(90deg,#f08b2c,#feae47);border:0;color:#fff;font-weight:800;text-shadow:0 1px 2px rgba(120,50,0,.25);box-shadow:0 10px 22px rgba(240,139,44,.3)}
[dir="rtl"] .link-btn.primary{background:linear-gradient(270deg,#f08b2c,#feae47)}

/* لوحات المعلومات */
.panel,.block{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 28px var(--gsh);padding:16px 16px 8px;margin-top:12px}
.block.tight{padding-bottom:14px}
.panel h2,.block h2{font-size:17px;font-weight:700;margin:0 0 4px}
.panel .sub{font-size:13px;color:var(--dim);margin:0 0 6px}
.rows{margin:0;padding:0}
.rows>div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 0;border-bottom:1px solid var(--sep)}
.rows>div:last-child{border-bottom:0}
.rows dt{color:var(--dim);font-size:14px}
.rows dd{margin:0;font-size:15px;font-weight:600;text-align:end}
.rows.panel{padding:2px 16px;margin-top:12px}
.note{font-size:13px;color:var(--dim);line-height:1.7;margin:8px 0 0}

/* القبلة */
.q-status{display:flex;justify-content:center;margin-top:16px;min-height:38px}
.q-status .big{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:14.5px;font-weight:700;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 6px 16px var(--gsh)}
.q-status .small{display:none}
.q-status.aligned .big{background:linear-gradient(180deg,#ff9d45,var(--arrow));color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(245,132,31,.4)}
.compass-wrap{position:relative;width:min(80vw,40vh,330px);aspect-ratio:1;margin:16px auto 0;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.42),rgba(255,255,255,.14) 70%);border:1px solid rgba(255,255,255,.7);
  box-shadow:0 18px 40px rgba(70,80,100,.18),inset 0 0 0 12px rgba(255,255,255,.16);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
:root[data-theme="dark"] .compass-wrap{background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.1),rgba(255,255,255,.03) 70%);border-color:rgba(255,255,255,.14);box-shadow:0 18px 40px rgba(0,0,0,.4)}
@media (prefers-color-scheme:dark){:root[data-theme="auto"] .compass-wrap{background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.1),rgba(255,255,255,.03) 70%);border-color:rgba(255,255,255,.14);box-shadow:0 18px 40px rgba(0,0,0,.4)}}
.compass-wrap svg{width:100%;height:100%;display:block;overflow:visible;direction:ltr}
.qbig{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-top:14px;direction:rtl}
[dir="ltr"] .qbig{direction:ltr}
.qbig b{font-family:var(--num);font-size:58px;font-weight:800;line-height:1;direction:ltr}
.qbig span{font-size:20px;font-weight:700;color:var(--dim)}
.qsub{text-align:center;color:var(--dim);font-size:14px;margin-top:4px}
.qsub b{color:var(--fg)}
.q-nums{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;padding:11px 6px}
.q-nums div{text-align:center;display:flex;flex-direction:column;gap:2px}
.q-nums div+div{border-inline-start:1px solid var(--sep)}
.q-nums b{font-family:var(--num);font-size:17px;font-weight:700;direction:ltr;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.q-nums b.t{font-family:var(--ui);font-size:15px;direction:inherit}
.q-nums span{font-size:11.5px;color:var(--dim)}
.q-quality{display:flex;width:max-content;max-width:100%;align-items:center;justify-content:center;gap:10px;margin:12px auto 0;font-size:13.5px;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.q-quality b{font-weight:700;color:var(--fg)}
.q-bars{display:inline-flex;align-items:flex-end;gap:2px;height:14px;direction:ltr}
.q-bars i{width:4px;border-radius:2px;background:var(--line-2)}
.q-bars i:nth-child(1){height:5px}.q-bars i:nth-child(2){height:8px}.q-bars i:nth-child(3){height:11px}.q-bars i:nth-child(4){height:14px}
.q-quality[data-q="1"] .q-bars i:nth-child(-n+1){background:#e0705f}
.q-quality[data-q="2"] .q-bars i:nth-child(-n+2){background:#e5a84f}
.q-quality[data-q="3"] .q-bars i:nth-child(-n+3){background:#7dbf6a}
.q-quality[data-q="4"] .q-bars i:nth-child(-n+4){background:#3fb27f}
.q-hint{margin:8px auto 0;max-width:34ch;text-align:center;font-size:13px;line-height:1.7;color:var(--accent)}

/* القمر */
.moon-hero{display:flex;flex-direction:column;align-items:center;margin-top:14px;padding:12px 16px 16px}
#moonCanvas{width:210px;height:210px}
.moon-cap{font-size:12px;color:var(--dim);margin-top:2px}
.moon-phase{font-size:28px;font-weight:700;margin-top:4px;line-height:1.2}
.moon-sub{color:var(--dim);font-size:14px}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.phases div{text-align:center;padding:10px 2px;background:var(--panel2);border-radius:16px}
.phases svg{width:28px;height:28px;display:block;margin:0 auto 6px}
.phases b{display:block;font-size:12.5px;font-weight:600}
.phases span{display:block;font-size:11.5px;color:var(--dim)}
.mansion-wrap{display:flex;gap:16px;align-items:center}
.mansion-wrap svg{width:128px;height:128px;flex:none}
.mansion-txt .lbl{font-size:13px;color:var(--dim)}
.mansion-txt .m{font-size:24px;font-weight:700;line-height:1.3}
.mansion-txt .s{font-size:14px;color:var(--dim)}
.star-name{font-size:26px;font-weight:700}
.bar{height:6px;border-radius:6px;background:var(--sep);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--arrow2),#feae47);border-radius:6px}
[dir="rtl"] .bar i{background:linear-gradient(270deg,var(--arrow2),#feae47);margin-inline-start:0}
.bar-meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--dim)}

/* الإعدادات */
.set-group{margin-top:18px}
.set-group h3{font-size:13px;color:var(--dim);font-weight:600;margin:0 6px 7px}
.set{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 8px 22px var(--gsh)}
.set>*{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:13px 16px;border-bottom:1px solid var(--sep);text-align:start;min-height:52px}
.set>*:last-child{border-bottom:0}
.set label,.set .lbl{font-size:15px}
.set .lbl small{display:block;font-size:12.5px;color:var(--dim);margin-top:1px}
.set .val{color:var(--dim);font-size:14px}
[dir="rtl"] .chev{transform:scaleX(-1)}
select{font:inherit;background:transparent;border:0;font-size:15px;text-align:end;max-width:60%;-webkit-appearance:none;appearance:none;color:var(--dim)}
select option{background:var(--sheet);color:var(--fg)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex:none}
.seg button{padding:6px 11px;font-size:13.5px;color:var(--dim);border-radius:9px}
.seg button.on{background:var(--arrow);color:#fff;font-weight:700;box-shadow:0 3px 8px rgba(245,132,31,.3)}
.switch{position:relative;width:50px;height:30px;border-radius:30px;background:var(--line-2);flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:inset-inline-start .2s}
.switch[aria-checked="true"]{background:var(--arrow)}
.switch[aria-checked="true"]::after{inset-inline-start:23px}

.stepper{display:inline-flex;align-items:center;gap:4px}

/* عن التطبيق */

.zk-top .seg button{padding:9px 4px;font-size:15px;border-radius:12px}
.zk-size{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:16px;overflow:hidden;flex:none}
.zk-size button{width:42px;height:46px;font-family:var(--naskh);color:var(--dim);font-size:15px}

.zk-prog{margin:14px 4px 6px}
.zk-prog .bar-meta button{color:var(--accent);font-size:12.5px;font-weight:600}
.zk-done-all{text-align:center;padding:16px 10px;font-family:var(--naskh);font-size:20px;color:var(--accent);background:var(--panel);border:1px solid var(--line);border-radius:22px;margin-top:8px}
.zk-list{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.zk{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:0 8px 22px var(--gsh);padding:18px 18px 14px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:opacity .25s,transform .12s}

.zk .fadl{font-size:13px;color:var(--dim);line-height:1.75;margin-top:10px;padding-top:10px;border-top:1px solid var(--sep);direction:rtl;text-align:right}
.zk .foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.zk .times-lbl{font-size:12.5px;color:var(--dim)}
.zk .ctr{position:relative;width:54px;height:54px;flex:none;border-radius:50%;background:var(--panel2)}
.zk .ctr svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.zk .ctr b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--num);font-size:19px;font-weight:700;direction:ltr}
.zk.done{opacity:.45}
.zk.done .txt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.zk.done .fadl{display:none}

/* الشريط السفلي العائم */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 6px);width:calc(100% - 28px);max-width:452px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:26px;padding:6px;z-index:20;box-shadow:0 10px 30px var(--gsh)}

/* شاشة الإضافة للشاشة الرئيسية */
body.gated{overflow:hidden}
body.gated .tabs{display:none}
.gate{position:fixed;inset:0;z-index:50;overflow:auto;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 24%,var(--haze) 48%,var(--sand) 72%,var(--sand2) 100%)}
.gate-in{max-width:420px;margin:0 auto;padding:calc(var(--safe-t) + 44px) 22px calc(var(--safe-b) + 110px);text-align:center}
.gate-icon{width:104px;height:104px;border-radius:24px;box-shadow:0 14px 34px rgba(60,60,80,.28),0 0 0 1px rgba(255,255,255,.7);display:block;margin:0 auto}
.gate-title{font-size:40px;font-weight:700;margin:16px 0 4px;line-height:1.1}

.gate-feats{list-style:none;padding:4px 14px;margin:0 0 14px;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:22px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.gate-feats li{display:flex;align-items:center;gap:12px;padding:11px 2px;font-size:15px;border-bottom:1px solid var(--sep)}

.gate-skip{display:block;margin:22px auto 0;color:var(--dim);font-size:14px;text-decoration:underline;text-underline-offset:4px;padding:8px}
.gate-arrow{position:fixed;width:46px;height:46px;border-radius:50%;background:var(--arrow);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(245,132,31,.4);z-index:51}
.gate-arrow svg{width:26px;height:26px}
.gate-arrow.bottom{bottom:calc(var(--safe-b) + 14px);left:calc(50% - 23px);animation:nudge-down 1.3s ease-in-out infinite}
.gate-arrow.top{top:calc(var(--safe-t) + 14px);right:18px;animation:nudge-up 1.3s ease-in-out infinite}
.gate-arrow.top svg{transform:rotate(180deg)}
@keyframes nudge-down{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes nudge-up{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.gate-arrow{animation:none!important}}

/* النوافذ */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:40;display:none;align-items:flex-end;justify-content:center}

.sheet{background:var(--sheet);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;border:1px solid var(--line);border-bottom:0;padding:10px 18px calc(var(--safe-b) + 22px);animation:up .28s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

.welcome{text-align:center;padding:4px 0 6px}

.steps{list-style:none;padding:0;margin:14px 0;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:center;padding:10px 0;counter-increment:s;font-size:15px}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--arrow);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.steps svg{vertical-align:-5px;display:inline-block;margin:0 2px}
.month{width:100%;border-collapse:collapse;font-size:13px}

.month td{text-align:center;padding:8px 2px;border-top:1px solid var(--sep);direction:ltr;font-family:var(--num)}
.month tr.today td{color:#fff;background:var(--arrow);font-weight:700}
.month tr.today td:first-child{border-start-start-radius:10px;border-end-start-radius:10px}
.month tr.today td:last-child{border-start-end-radius:10px;border-end-end-radius:10px}
.month td.d{color:var(--dim);white-space:nowrap;direction:inherit;font-family:var(--ui)}
.month tr.today td.d{color:#fff}
.city-list{max-height:50vh;overflow:auto;margin:6px 0}
.city-list button{display:flex;justify-content:space-between;width:100%;padding:13px 4px;border-bottom:1px solid var(--sep);font-size:15px}
.city-list button span{color:var(--dim);font-size:13px;direction:ltr}
.field{display:flex;gap:8px;margin:8px 0}
.field input{flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--night-3);border:1px solid var(--line-2);border-radius:14px;padding:12px;font-size:16px;direction:ltr;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 92px);background:var(--toast-bg);color:var(--toast-fg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;max-width:calc(100% - 40px);text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.toast.on{opacity:1}
</style>
